<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: {
      'gift-slate': 'var(--color-primary)',
      'gift-slate-light': 'var(--color-primary-light)',
      'gift-slate-dark': 'var(--color-primary-dark)',
      'gift-slate-bright': 'var(--color-primary-bright)',
      'gift-accent': 'var(--color-accent)',
      'bg-warm': 'var(--color-bg-warm)',
      'neutral-dark': 'var(--color-text-dark)',
      'dark-bg': '#0A0D12',
      'dark-card': '#141A24',

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root, [data-theme="gold-obsidian"] {
    --color-primary: #C5A059; --color-primary-light: #DFBA67;
    --color-primary-dark: #9E7D3B; --color-primary-bright: #E6C687;
    --color-accent: #D4AF37; --color-bg-warm: #FAF8F5;
    --color-text-dark: #0B0F17;
    --color-rgb-primary: 197, 160, 89;
    --color-rgb-bright: 230, 198, 135;
  }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--color-bg-warm); color: var(--color-text-dark); transition: background-color 0.4s, color 0.4s; min-height: 100vh; overflow-x: hidden; }
  .dark body { background: #0A0D12; color: #E2E8F0; }
  h1, h2, h3 { font-family: 'Outfit', sans-serif; letter-spacing: -0.03em; }

  .gold-gradient-text { background: linear-gradient(135deg, #E6C687 0%, #C5A059 50%, #9E7D3B 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.35; pointer-events: none; z-index: 0; }

  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(var(--color-rgb-primary), 0.12);
    border: 1px solid rgba(var(--color-rgb-primary), 0.25);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--color-primary); font-weight: 700; cursor: pointer;
    transition: all 0.3s;
  }
  .icon-btn:hover { background: var(--color-primary); color: white; transform: scale(1.08); }
  .dark .icon-btn { background: rgba(var(--color-rgb-bright), 0.12); border-color: rgba(var(--color-rgb-bright), 0.25); color: var(--color-primary-bright); }
  .dark .icon-btn:hover { background: var(--color-primary-bright); color: #0A0D12; }
  body.rtl { direction: rtl; }

  .error-num {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: clamp(8rem, 22vw, 18rem);
    line-height: 0.85;
    letter-spacing: -0.06em;
  }
  .error-num span { display: inline-block; animation: bounceNum 3s ease-in-out infinite; }
  .error-num span:nth-child(2) { animation-delay: 0.15s; }
  .error-num span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounceNum {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .float-slow { animation: floatSlow 6s ease-in-out infinite; }
  .float-medium { animation: floatSlow 4.5s ease-in-out infinite; }
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-18px) rotate(-6deg); }
  }

  .btn-gold {
    background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
    color: white;
    box-shadow: 0 10px 25px -5px rgba(var(--color-rgb-primary), 0.4);
    transition: all 0.3s;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 15px 32px -6px rgba(var(--color-rgb-primary), 0.5); }
  .dark .btn-gold { background: linear-gradient(135deg, var(--color-primary-bright), var(--color-primary)); color: #0A0D12; }

  .btn-outline { border: 2px solid rgba(var(--color-rgb-primary), 0.4); color: var(--color-primary); transition: all 0.3s; }
  .btn-outline:hover { background: rgba(var(--color-rgb-primary), 0.08); transform: translateY(-2px); }
  .dark .btn-outline { border-color: rgba(var(--color-rgb-bright), 0.4); color: var(--color-primary-bright); }
  .dark .btn-outline:hover { background: rgba(var(--color-rgb-bright), 0.1); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 pt-28 pb-16 relative overflow-x-hidden">

  <!-- Background Ambient Orbs -->
  <div class="orb" style="width: 500px; height: 500px; background: rgba(197,160,89,0.35); top: -150px; left: -150px;"></div>
  <div class="orb" style="width: 400px; height: 400px; background: rgba(212,175,55,0.25); bottom: -120px; right: -120px;"></div>

  <!-- Top Navigation Bar: Left: Home Elevator | Right: Dark Mode & Switch -->
  <header class="fixed top-0 left-0 right-0 z-30 backdrop-blur-md bg-white/70 dark:bg-dark-bg/70 border-b border-gift-slate/10 dark:border-gift-slate-bright/10 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between">
      <!-- Left: Home Elevator Logo -->
      <a href="index.html" class="flex items-center space-x-3 group flex-nowrap" dir="ltr">
        <div class="w-11 h-11 bg-gradient-to-br from-gift-slate-light to-gift-slate rounded-2xl flex items-center justify-center flex-shrink-0 transform group-hover:rotate-12 transition-transform duration-300 shadow-lg border border-gift-slate/20">
          <i class="fas fa-elevator text-white dark:text-dark-bg text-xl"></i>
        </div>
        <div class="flex items-center whitespace-nowrap">
          <span class="text-2xl font-display font-extrabold tracking-tight text-neutral-dark dark:text-white">Home</span>
          <span class="text-2xl font-display font-extrabold tracking-tight gold-gradient-text ml-0.5">Elevator</span>
        </div>
      </a>

      <!-- Right: Dark Mode Toggle and RTL Switch -->
      <div class="flex items-center gap-2.5">
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="fas fa-moon dark:hidden"></i>
          <i class="fas fa-sun hidden dark:inline-block"></i>
        </button>
        <button id="rtl-toggle" class="icon-btn" title="Toggle RTL" aria-label="Toggle RTL">⇄</button>
      </div>
    </div>
  </header>

  <!-- Centered 404 Main Content -->
  <main class="relative z-10 w-full max-w-3xl text-center">

    <!-- Floating icons & 404 number -->
    <div class="relative mb-4">
      <i class="fas fa-stairs float-medium absolute hidden md:block text-3xl text-gift-slate/30 dark:text-gift-slate-bright/30" style="top: 20%; left: 8%;"></i>
      <i class="fas fa-tools float-slow absolute hidden md:block text-3xl text-gift-slate/30 dark:text-gift-slate-bright/30" style="bottom: 15%; right: 10%;"></i>
      <i class="fas fa-screwdriver-wrench float-slow absolute hidden md:block text-2xl text-gift-slate/25 dark:text-gift-slate-bright/25" style="top: 12%; right: 12%;"></i>

      <!-- 404 -->
      <div class="error-num">
        <span class="gold-gradient-text">4</span><span style="color: var(--color-primary-dark);" class="dark:!text-gift-slate-bright">0</span><span class="gold-gradient-text">4</span>
      </div>
    </div>

    <!-- Headline -->
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-display font-extrabold text-neutral-dark dark:text-white mb-4">
      This floor doesn't exist
    </h1>
    <p class="text-base md:text-lg text-neutral-dark/70 dark:text-gray-400 max-w-xl mx-auto leading-relaxed mb-10">
      Looks like the page you're looking for took a wrong turn. Don't worry — our elevators always find their way. Let's get you back on track.
    </p>

    <!-- Buttons -->
    <div class="flex flex-wrap gap-4 justify-center mb-14">
      <a href="index.html" class="btn-gold px-8 py-4 rounded-full font-bold text-sm uppercase tracking-wider inline-flex items-center gap-2">
        <i class="fas fa-home"></i> Back to Home
      </a>
      <a href="contact.html" class="btn-outline px-8 py-4 rounded-full font-bold text-sm uppercase tracking-wider inline-flex items-center gap-2">
        <i class="fas fa-headset"></i> Contact Support
      </a>
    </div>

    <!-- Quick links -->
    

    <!-- Bottom hint -->
    <p class="text-xs text-neutral-dark/50 dark:text-gray-500 mt-8">
      Error code: <span class="font-bold text-gift-slate dark:text-gift-slate-bright">404</span> · Need urgent help? Call <a href="tel:+18005550199" class="underline font-bold text-gift-slate dark:text-gift-slate-bright">+1 (800) 555-0199</a>
    </p>

  </main>

<script>
  (function() {
    const toggle = document.getElementById('theme-toggle');
    const root = document.documentElement;
    if (localStorage.getItem('he-theme') === 'dark') root.classList.add('dark');
    toggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      localStorage.setItem('he-theme', root.classList.contains('dark') ? 'dark' : 'light');
    });
  })();
  (function() {
    const toggle = document.getElementById('rtl-toggle');
    const root = document.documentElement;
    if (localStorage.getItem('he-dir') === 'rtl') {
      document.body.classList.add('rtl');
      root.setAttribute('dir', 'rtl');
    }
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('rtl');
      const isRtl = document.body.classList.contains('rtl');
      root.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
      localStorage.setItem('he-dir', isRtl ? 'rtl' : 'ltr');
    });
  })();
</script>
</body>
</html>
