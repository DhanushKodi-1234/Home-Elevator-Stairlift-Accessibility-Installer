<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D99C"/>
      <stop offset="45%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8E6C28"/>
    </linearGradient>
    <linearGradient id="doorGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="innerRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Luxury Rounded Badge with bevel rim -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#goldGrad)" stroke="url(#innerRim)" stroke-width="1.5"/>

  <!-- Brand Symbol Group with subtle drop shadow -->
  <g filter="url(#subtleGlow)">
    <!-- Architectural Elevator Cab Frame -->
    <rect x="15" y="15" width="34" height="36" rx="5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Elevator Center Door Split Line -->
    <line x1="32" y1="17" x2="32" y2="49" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left & Right Glass Door Panels -->
    <rect x="18.5" y="21" width="10.5" height="23" rx="2.5" fill="url(#doorGlass)" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="35" y="21" width="10.5" height="23" rx="2.5" fill="url(#doorGlass)" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- Elevator Door Handle Accents -->
    <line x1="30" y1="30" x2="30" y2="35" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="34" y1="30" x2="34" y2="35" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Upward Mobility Chevron / Indicator at Top -->
    <path d="M28 10.5 L32 6.5 L36 10.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dynamic Stairlift / Ascending Motion Arc Line across base -->
    <path d="M11 54.5 C 22 55.5, 42 53.5, 53 49" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
