<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C687"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7D3B"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA67"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#badgeGrad)"/>
  
  <!-- Elevator Cab Frame -->
  <rect x="14" y="14" width="36" height="36" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  
  <!-- Elevator Center Split Doors Line -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Door Glass Panels -->
  <rect x="18" y="20" width="10" height="20" rx="1.5" fill="rgba(255,255,255,0.25)" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="36" y="20" width="10" height="20" rx="1.5" fill="rgba(255,255,255,0.25)" stroke="#FFFFFF" stroke-width="1.2"/>
  
  <!-- Up Arrow Indicator -->
  <path d="M32 8 L36 12 L28 12 Z" fill="#FFFFFF"/>
</svg>
