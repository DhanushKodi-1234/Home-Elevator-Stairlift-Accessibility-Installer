<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" data-theme="gold-obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Home Elevator</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="tailwind.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: {
      'gift-slate': 'var(--color-primary)',
      'gift-slate-light': 'var(--color-primary-light)',
      'gift-slate-dark': 'var(--color-primary-dark)',
      'gift-slate-bright': 'var(--color-primary-bright)',
      'gift-accent': 'var(--color-accent)',
      'bg-warm': 'var(--color-bg-warm)',
      'neutral-dark': 'var(--color-text-dark)',
      'dark-bg': '#0A0D12',
      'dark-card': '#141A24',
    },
    fontFamily: { sans: ['Plus Jakarta Sans','system-ui','sans-serif'], display: ['Outfit','sans-serif'] }
  }}
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root, [data-theme="gold-obsidian"] {
    --color-primary: #C5A059; --color-primary-light: #DFBA67;
    --color-primary-dark: #9E7D3B; --color-primary-bright: #E6C687;
    --color-accent: #D4AF37; --color-bg-warm: #FAF8F5;
    --color-text-dark: #0B0F17;
    --color-rgb-primary: 197, 160, 89;
    --color-rgb-bright: 230, 198, 135;
  }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--color-bg-warm); color: var(--color-text-dark); transition: background-color 0.4s, color 0.4s; }
  .dark body { background: #0A0D12; color: #E2E8F0; }
  h1, h2, h3 { font-family: 'Outfit', sans-serif; letter-spacing: -0.02em; }

  .bg-blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; pointer-events: none; z-index: 0; }

  .auth-input {
    width: 100%;
    padding: 0.65rem 0.9rem;
    border-radius: 10px;
    background: rgba(var(--color-rgb-primary), 0.05);
    border: 1px solid rgba(var(--color-rgb-primary), 0.2);
    color: var(--color-text-dark);
    font-size: 0.85rem;
    transition: all 0.25s ease;
  }
  .auth-input:focus {
    outline: none;
    border-color: var(--color-primary);
    background: rgba(var(--color-rgb-primary), 0.08);
    box-shadow: 0 0 0 3px rgba(var(--color-rgb-primary), 0.12);
  }
  .auth-input::placeholder { color: rgba(11, 15, 23, 0.4); }

  .dark .auth-input {
    background: rgba(var(--color-rgb-bright), 0.06);
    border-color: rgba(var(--color-rgb-bright), 0.2);
    color: #E2E8F0;
  }
  .dark .auth-input:focus {
    border-color: var(--color-primary-bright);
    background: rgba(var(--color-rgb-bright), 0.1);
    box-shadow: 0 0 0 3px rgba(var(--color-rgb-bright), 0.15);
  }
  .dark .auth-input::placeholder { color: rgba(226, 232, 240, 0.4); }

  .social-btn {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.55rem 0.9rem; border-radius: 10px;
    border: 1px solid rgba(var(--color-rgb-primary), 0.25);
    background: transparent; font-weight: 600; font-size: 0.8rem;
    color: var(--color-text-dark);
    transition: all 0.2s ease; cursor: pointer;
  }
  .social-btn:hover { background: rgba(var(--color-rgb-primary), 0.08); transform: translateY(-1px); }
  .dark .social-btn { border-color: rgba(var(--color-rgb-bright), 0.25); color: #E2E8F0; }
  .dark .social-btn:hover { background: rgba(var(--color-rgb-bright), 0.12); }
  .social-btn.apple { background: #111827; color: white; border-color: #111827; }
  .dark .social-btn.apple { background: #E2E8F0; color: #0A0D12; border-color: #E2E8F0; }

  .icon-btn {
    position: fixed; top: 0.85rem; z-index: 20;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(var(--color-rgb-primary), 0.12);
    border: 1px solid rgba(var(--color-rgb-primary), 0.25);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-primary); font-weight: 700; cursor: pointer;
    transition: all 0.3s ease; font-size: 0.8rem;
  }
  .icon-btn:hover { background: var(--color-primary); color: white; transform: scale(1.08); }
  .dark .icon-btn { background: rgba(var(--color-rgb-bright), 0.12); border-color: rgba(var(--color-rgb-bright), 0.25); color: var(--color-primary-bright); }
  .dark .icon-btn:hover { background: var(--color-primary-bright); color: #0A0D12; }

  .rtl-btn { right: 0.85rem; }
  .theme-btn { right: 3.35rem; }
  body.rtl { direction: rtl; }
  body.rtl .rtl-btn { right: auto; left: 0.85rem; }
  body.rtl .theme-btn { right: auto; left: 3.35rem; }

  .gold-gradient-text { background: linear-gradient(135deg, #E6C687 0%, #C5A059 50%, #9E7D3B 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  .btn-gold {
    background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
    color: #0B0F17 !important;
    font-weight: 700;
    box-shadow: 0 6px 16px -4px rgba(var(--color-rgb-primary), 0.4);
    transition: all 0.3s ease;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -5px rgba(var(--color-rgb-primary), 0.5); }
  .dark .btn-gold { background: linear-gradient(135deg, var(--color-primary-bright) 0%, var(--color-primary) 100%); color: #0A0D12 !important; }

  /* Compact card */
  .auth-card {
    max-width: 380px;
    padding: 1.5rem 1.5rem;
  }
  @media (min-width: 640px) {
    .auth-card { padding: 1.75rem 2rem; }
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-blob" style="width: 300px; height: 300px; background: rgba(197, 160, 89, 0.3); top: -80px; left: -80px;"></div>
  <div class="bg-blob" style="width: 260px; height: 260px; background: rgba(212, 175, 55, 0.25); bottom: -60px; right: -60px;"></div>

  <button id="theme-toggle" class="icon-btn theme-btn" title="Toggle Theme">
    <i class="fas fa-moon dark:hidden"></i>
    <i class="fas fa-sun hidden dark:inline-block"></i>
  </button>
  <button id="rtl-toggle" class="icon-btn rtl-btn" title="Toggle RTL">⇄</button>

  <div class="auth-card relative z-10 w-full bg-white dark:bg-dark-card rounded-2xl shadow-2xl border border-gift-slate/15 dark:border-gift-slate-bright/20 transition-colors">

    <!-- Logo -->
    <div class="text-center mb-5">
      <a href="index.html" class="inline-flex items-center space-x-3 group flex-nowrap mb-4" dir="ltr" title="Home Elevator">
        <img src="Assets/logo.svg" alt="Home Elevator Logo" class="w-10 h-10 object-contain flex-shrink-0 group-hover:scale-105 transition-transform duration-300">
        <div class="flex items-center whitespace-nowrap">
          <span class="text-2xl font-display font-extrabold tracking-tight text-neutral-dark dark:text-white">Home</span>
          <span class="text-2xl font-display font-extrabold tracking-tight gold-gradient-text ml-0.5">Elevator</span>
        </div>
      </a>
      <h1 class="text-2xl font-extrabold text-neutral-dark dark:text-white mb-1">Welcome Back</h1>
      <p class="text-xs text-neutral-dark/60 dark:text-gray-400">Sign in to manage your upcoming installs</p>
    </div>

    <!-- Form -->
    <form onsubmit="event.preventDefault(); window.location.href='admin.html';" class="space-y-3.5">
      <div>
        <label class="block text-[11px] font-bold text-neutral-dark dark:text-white mb-1.5 uppercase tracking-wide">Email Address</label>
        <input type="email" required placeholder="you@example.com" class="auth-input">
      </div>

      <div>
        <label class="block text-[11px] font-bold text-neutral-dark dark:text-white mb-1.5 uppercase tracking-wide">Password</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••" class="auth-input pr-10">
          <button type="button" onclick="const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password';" class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-dark/50 dark:text-gray-500 hover:text-gift-slate dark:hover:text-gift-slate-bright text-xs">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center gap-1.5 text-[11px] text-neutral-dark dark:text-gray-300 cursor-pointer">
          <input type="checkbox" class="w-3.5 h-3.5 rounded" style="accent-color: var(--color-primary);">
          Remember me
        </label>
        <a href="#" class="text-[11px] font-bold text-gift-slate dark:text-gift-slate-bright">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-gold w-full py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-2">
        <i class="fas fa-sign-in-alt text-xs"></i> Log In
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-4">
      <div class="flex-1 h-px bg-gift-slate/15 dark:bg-gift-slate-bright/15"></div>
      <span class="text-[10px] font-bold text-neutral-dark/50 dark:text-gray-500 tracking-widest">OR CONTINUE WITH</span>
      <div class="flex-1 h-px bg-gift-slate/15 dark:bg-gift-slate-bright/15"></div>
    </div>

    <!-- Social -->
    <div class="grid grid-cols-2 gap-2.5 mb-5">
      <button class="social-btn">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Google
      </button>
      <button class="social-btn apple">
        <i class="fab fa-apple text-base"></i> Apple
      </button>
    </div>

    <p class="text-center text-xs text-neutral-dark/70 dark:text-gray-400">
      Don't have an account?
      <a href="signup.html" class="font-bold ml-1 text-gift-slate dark:text-gift-slate-bright">Create Account</a>
    </p>
  </div>

<script>
  (function() {
    const toggle = document.getElementById('theme-toggle');
    const root = document.documentElement;
    if (localStorage.getItem('he-theme') === 'dark') root.classList.add('dark');
    toggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      localStorage.setItem('he-theme', root.classList.contains('dark') ? 'dark' : 'light');
    });
  })();
  (function() {
    const toggle = document.getElementById('rtl-toggle');
    if (localStorage.getItem('he-dir') === 'rtl') document.body.classList.add('rtl');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('rtl');
      localStorage.setItem('he-dir', document.body.classList.contains('rtl') ? 'rtl' : 'ltr');
    });
  })();
</script>
</body>
</html>
