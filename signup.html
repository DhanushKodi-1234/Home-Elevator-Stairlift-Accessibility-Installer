<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth" data-theme="gold-obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Home Elevator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23DFBA67'/%3E%3Cstop offset='100%25' stop-color='%23C5A059'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cg transform='translate(14, 15.2) scale(0.07)'%3E%3Cpath fill='%23ffffff' d='M292.7-4.7l64 64c6.2 6.2 16.4 6.2 22.6 0l64-64c4.6-4.6 5.9-11.5 3.5-17.4S438.5-32 432-32L304-32c-6.5 0-12.3 3.9-14.8 9.9s-1.1 12.9 3.5 17.4zm-160-22.6l-64 64c-4.6 4.6-5.9 11.5-3.5 17.4S73.5 64 80 64l128 0c6.5 0 12.3-3.9 14.8-9.9s1.1-12.9-3.5-17.4l-64-64c-6.2-6.2-16.4-6.2-22.6 0zM64 128c-35.3 0-64 28.7-64 64L0 448c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64L64 128zm96 96a48 48 0 1 1 0 96 48 48 0 1 1 0-96zM80 400c0-26.5 21.5-48 48-48l64 0c26.5 0 48 21.5 48 48l0 16c0 17.7-14.3 32-32 32l-96 0c-17.7 0-32-14.3-32-32l0-16zm192 0c0-26.5 21.5-48 48-48l64 0c26.5 0 48 21.5 48 48l0 16c0 17.7-14.3 32-32 32l-96 0c-17.7 0-32-14.3-32-32l0-16zm32-128a48 48 0 1 1 96 0 48 48 0 1 1 -96 0z'/%3E%3C/g%3E%3C/svg%3E">
<script src="tailwind.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: {
      'gift-slate': 'var(--color-primary)',
      'gift-slate-light': 'var(--color-primary-light)',
      'gift-slate-dark': 'var(--color-primary-dark)',
      'gift-slate-bright': 'var(--color-primary-bright)',
      'gift-accent': 'var(--color-accent)',
      'bg-warm': 'var(--color-bg-warm)',
      'neutral-dark': 'var(--color-text-dark)',
      'dark-bg': '#0A0D12',
      'dark-card': '#141A24',
    },
    fontFamily: { sans: ['Plus Jakarta Sans','system-ui','sans-serif'], display: ['Outfit','sans-serif'] }
  }}
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root, [data-theme="gold-obsidian"] {
    --color-primary: #C5A059; --color-primary-light: #DFBA67;
    --color-primary-dark: #9E7D3B; --color-primary-bright: #E6C687;
    --color-accent: #D4AF37; --color-bg-warm: #FAF8F5;
    --color-text-dark: #0B0F17;
    --color-rgb-primary: 197, 160, 89;
    --color-rgb-bright: 230, 198, 135;
  }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--color-bg-warm); color: var(--color-text-dark); transition: background-color 0.4s, color 0.4s; }
  .dark body { background: #0A0D12; color: #E2E8F0; }
  h1, h2, h3 { font-family: 'Outfit', sans-serif; letter-spacing: -0.02em; }

  .bg-blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; pointer-events: none; z-index: 0; }

  /* Compact auth inputs */
  .auth-input {
    width: 100%;
    padding: 0.52rem 0.8rem;
    border-radius: 9px;
    background: rgba(var(--color-rgb-primary), 0.05);
    border: 1px solid rgba(var(--color-rgb-primary), 0.2);
    color: var(--color-text-dark);
    font-size: 0.82rem;
    transition: all 0.25s ease;
  }
  .auth-input:focus {
    outline: none;
    border-color: var(--color-primary);
    background: rgba(var(--color-rgb-primary), 0.08);
    box-shadow: 0 0 0 3px rgba(var(--color-rgb-primary), 0.12);
  }
  .auth-input::placeholder { color: rgba(11, 15, 23, 0.4); }

  .dark .auth-input {
    background: rgba(var(--color-rgb-bright), 0.06);
    border-color: rgba(var(--color-rgb-bright), 0.2);
    color: #E2E8F0;
  }
  .dark .auth-input:focus {
    border-color: var(--color-primary-bright);
    background: rgba(var(--color-rgb-bright), 0.1);
    box-shadow: 0 0 0 3px rgba(var(--color-rgb-bright), 0.15);
  }
  .dark .auth-input::placeholder { color: rgba(226, 232, 240, 0.4); }

  .social-btn {
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    padding: 0.45rem 0.75rem; border-radius: 9px;
    border: 1px solid rgba(var(--color-rgb-primary), 0.25);
    background: transparent; font-weight: 600; font-size: 0.78rem;
    color: var(--color-text-dark);
    transition: all 0.2s ease; cursor: pointer;
  }
  .social-btn:hover { background: rgba(var(--color-rgb-primary), 0.08); transform: translateY(-1px); }
  .dark .social-btn { border-color: rgba(var(--color-rgb-bright), 0.25); color: #E2E8F0; }
  .dark .social-btn:hover { background: rgba(var(--color-rgb-bright), 0.12); }
  .social-btn.apple { background: #111827; color: white; border-color: #111827; }
  .dark .social-btn.apple { background: #E2E8F0; color: #0A0D12; border-color: #E2E8F0; }

  .icon-btn {
    position: fixed; top: 0.85rem; z-index: 20;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(var(--color-rgb-primary), 0.12);
    border: 1px solid rgba(var(--color-rgb-primary), 0.25);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-primary); font-weight: 700; cursor: pointer;
    transition: all 0.3s ease; font-size: 0.8rem;
  }
  .icon-btn:hover { background: var(--color-primary); color: white; transform: scale(1.08); }
  .dark .icon-btn { background: rgba(var(--color-rgb-bright), 0.12); border-color: rgba(var(--color-rgb-bright), 0.25); color: var(--color-primary-bright); }
  .dark .icon-btn:hover { background: var(--color-primary-bright); color: #0A0D12; }

  .rtl-btn { right: 0.85rem; }
  .theme-btn { right: 3.35rem; }
  body.rtl { direction: rtl; }
  body.rtl .rtl-btn { right: auto; left: 0.85rem; }
  body.rtl .theme-btn { right: auto; left: 3.35rem; }

  .gold-gradient-text { background: linear-gradient(135deg, #E6C687 0%, #C5A059 50%, #9E7D3B 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  .btn-gold {
    background: linear-gradient(135deg, var(--color-primary-light) 0%, var(--color-primary) 100%);
    color: white;
    box-shadow: 0 6px 16px -4px rgba(var(--color-rgb-primary), 0.4);
    transition: all 0.3s ease;
  }
  .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -5px rgba(var(--color-rgb-primary), 0.5); }
  .dark .btn-gold { background: linear-gradient(135deg, var(--color-primary-bright) 0%, var(--color-primary) 100%); color: #0A0D12; }

  /* Compact card */
  .auth-card {
    max-width: 350px;
    padding: 1.25rem 1.25rem;
  }
  @media (min-width: 640px) {
    .auth-card {
      max-width: 355px;
      padding: 1.35rem 1.6rem;
    }
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="bg-blob" style="width: 300px; height: 300px; background: rgba(197, 160, 89, 0.3); top: -80px; right: -80px;"></div>
  <div class="bg-blob" style="width: 260px; height: 260px; background: rgba(212, 175, 55, 0.25); bottom: -60px; left: -60px;"></div>

  <button id="theme-toggle" class="icon-btn theme-btn" title="Toggle Theme">
    <i class="fas fa-moon dark:hidden"></i>
    <i class="fas fa-sun hidden dark:inline-block"></i>
  </button>
  <button id="rtl-toggle" class="icon-btn rtl-btn" title="Toggle RTL">⇄</button>

  <div class="auth-card relative z-10 w-full bg-white dark:bg-dark-card rounded-2xl shadow-2xl border border-gift-slate/15 dark:border-gift-slate-bright/20 transition-colors">

    <!-- Logo -->
    <div class="text-center mb-3.5">
      <a href="index.html" class="inline-flex items-center space-x-2.5 group flex-nowrap mb-2.5 cursor-pointer" dir="ltr" title="Home Elevator">
        <div class="w-9 h-9 bg-gradient-to-br from-gift-slate-light to-gift-slate rounded-xl flex items-center justify-center flex-shrink-0 transform group-hover:rotate-12 transition-transform duration-300 shadow-md border border-gift-slate/20">
          <i class="fas fa-elevator text-white dark:text-dark-bg text-base"></i>
        </div>
        <div class="flex items-center whitespace-nowrap">
          <span class="text-xl font-display font-extrabold tracking-tight text-neutral-dark dark:text-white">Home</span>
          <span class="text-xl font-display font-extrabold tracking-tight gold-gradient-text ml-0.5">Elevator</span>
        </div>
      </a>
      <h1 class="text-xl font-extrabold text-neutral-dark dark:text-white mb-0.5">Create Account</h1>
      <p class="text-[11px] text-neutral-dark/60 dark:text-gray-400">Join us and start your mobility journey</p>
    </div>

    <!-- Form -->
    <form onsubmit="event.preventDefault(); window.location.href='login.html';" class="space-y-2.5">
      <div>
        <label class="block text-[10.5px] font-bold text-neutral-dark dark:text-white mb-1 uppercase tracking-wide">First Name</label>
        <input type="text" required placeholder="Jane" class="auth-input">
      </div>

      <div>
        <label class="block text-[10.5px] font-bold text-neutral-dark dark:text-white mb-1 uppercase tracking-wide">Email Address</label>
        <input type="email" required placeholder="you@example.com" class="auth-input">
      </div>

      <div>
        <label class="block text-[10.5px] font-bold text-neutral-dark dark:text-white mb-1 uppercase tracking-wide">Password</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="Minimum 8 characters" class="auth-input pr-9">
          <button type="button" onclick="const p=document.getElementById('password'); p.type = p.type==='password' ? 'text' : 'password';" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-neutral-dark/50 dark:text-gray-500 hover:text-gift-slate dark:hover:text-gift-slate-bright text-xs">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-[10.5px] font-bold text-neutral-dark dark:text-white mb-1 uppercase tracking-wide">Confirm Password</label>
        <input type="password" required placeholder="Re-enter password" class="auth-input">
      </div>

      <label class="flex items-start gap-2 text-[10.5px] text-neutral-dark/70 dark:text-gray-400 cursor-pointer leading-snug pt-0.5">
        <input type="checkbox" required class="mt-0.5 w-3 h-3 rounded" style="accent-color: var(--color-primary);">
        <span>I agree to the <a href="#" class="font-bold text-gift-slate dark:text-gift-slate-bright">Terms</a> &amp; <a href="#" class="font-bold text-gift-slate dark:text-gift-slate-bright">Privacy</a></span>
      </label>

      <button type="submit" class="btn-gold w-full py-2 rounded-lg font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-2 mt-1">
        <i class="fas fa-user-plus text-[11px]"></i> Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-2.5 my-3">
      <div class="flex-1 h-px bg-gift-slate/15 dark:bg-gift-slate-bright/15"></div>
      <span class="text-[9.5px] font-bold text-neutral-dark/50 dark:text-gray-500 tracking-wider">OR SIGN UP WITH</span>
      <div class="flex-1 h-px bg-gift-slate/15 dark:bg-gift-slate-bright/15"></div>
    </div>

    <!-- Social -->
    <div class="grid grid-cols-2 gap-2 mb-3.5">
      <button class="social-btn">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Google
      </button>
      <button class="social-btn apple">
        <i class="fab fa-apple text-sm"></i> Apple
      </button>
    </div>

    <p class="text-center text-[11px] text-neutral-dark/70 dark:text-gray-400">
      Already have an account?
      <a href="login.html" class="font-bold ml-1 text-gift-slate dark:text-gift-slate-bright">Sign In</a>
    </p>
  </div>

<script>
  (function() {
    const toggle = document.getElementById('theme-toggle');
    const root = document.documentElement;
    if (localStorage.getItem('he-theme') === 'dark') root.classList.add('dark');
    toggle.addEventListener('click', () => {
      root.classList.toggle('dark');
      localStorage.setItem('he-theme', root.classList.contains('dark') ? 'dark' : 'light');
    });
  })();
  (function() {
    const toggle = document.getElementById('rtl-toggle');
    if (localStorage.getItem('he-dir') === 'rtl') document.body.classList.add('rtl');
    toggle.addEventListener('click', () => {
      document.body.classList.toggle('rtl');
      localStorage.setItem('he-dir', document.body.classList.contains('rtl') ? 'rtl' : 'ltr');
    });
  })();
</script>
</body>
</html>
